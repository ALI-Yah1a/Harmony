<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmony</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">
        <span class="icon"><i class="fa-solid fa-guitar"></i></span>Harmony
      </div>
      <nav class="navs">
        <a href="#">Guitars</a>
        <a href="#">Pianos</a>
        <a href="#">Drums</a>
        <a href="#">Strings</a>
        <a href="#">Accessories</a>
      </nav>
      <div class="header-icons">
        <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="#"><i class="fa-solid fa-user"></i></a>
        <a href="#"><i class="fa-solid fa-cart-shopping"></i></a>
      </div>
    </header>
    <section class="hero">
     <div class="overlay"></div>
      <div class="hero-content">
        <h1>
          <span class="crafted-for">Crafted For</span>
          <span class="Perfection">Perfection</span>
        </h1>
        <p>
          Discover premium musical instuments from world-<br/>renowed brands. Every
          note,every chord,every <br/>performance matters.
        </p>
        <div class="hero-buttons">
          <button class="primary-btn">
            Explore Collection
            <span class="arrow"><i class="fa-solid fa-arrow-right"></i></span>
          </button>
          <button class="secondary-btn">View Categories</button>
        </div>
      </div>
    </section>
  </body>
</html>
